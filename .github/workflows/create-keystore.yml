
name: Create Android Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore my-daily-life.jks \
            -alias mydailylife \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10000 \
            -storepass:env KEYSTORE_PASSWORD \
            -keypass:env KEYSTORE_PASSWORD \
            -dname "CN=MY DAILY LIFE, OU=Personal, O=Personal, L=Incheon, C=KR"

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: my-daily-life.jks
          retention-days: 1
